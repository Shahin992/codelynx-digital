# Cloudflare Worker that serves the site from R2.
# Deployed by .github/workflows/deploy.yml on every push to the production branch.
name = "codelynx-digital-site"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[r2_buckets]]
binding = "SITE"
bucket_name = "codelynx-digital-site"
