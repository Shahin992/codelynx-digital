<!DOCTYPE html>
<html lang="en" data-root="../" data-page="contact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Codelynx Digital</title>
  <meta name="description" content="Get in touch with Codelynx Digital. Send us a message about your website, SEO or digital marketing project, or call or visit our office in Dhaka.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="siteNav"></div>
  <script src="../js/nav.js"></script>

  <main id="main">

    <!-- ============ CONTACT HERO + FORM ============ -->
    <section class="page-hero contact-hero glow">
      <div class="container contact-grid">
        <div class="contact-intro">
          <h1 class="split">Let's Talk</h1>
          <div class="page-hero__text reveal">
            <p>Tell us about your project. Fill out the form or call our office directly, and a real person will get back to you.</p>
          </div>

          <div class="contact-info">
            <div class="contact-info__row reveal">
              <svg class="contact-info__icon contact-info__icon--solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
              <div><h3>Our Office</h3><address>House-08, Road-22, Block-D, Section-6, Mirpur-1216<br>Dhaka, Bangladesh</address></div>
            </div>
            <div class="contact-info__row reveal">
              <svg class="contact-info__icon contact-info__icon--solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
              <div><h3>Phone Calls</h3><p><a class="contact-info__tel" href="tel:+8801580391983">+8801580391983</a></p></div>
            </div>
          </div>
        </div>

        <div class="contact-card reveal">
          <h2>Send Us a Message</h2>
          <!-- Messages are stored in the "Codelynx Digital - Contact" Google Form. Each field's name is that
               question's ID (form > ⋮ > Get pre-filled link shows them). js/main.js sends the form
               in the background and then opens data-thanks; without JavaScript it posts to Google directly. -->
          <form class="cform" action="https://docs.google.com/forms/d/e/1FAIpQLSe523XjLhZY9H89Xdy4HtD3K2BgK0SFF3TOqRw42m_493-f-w/formResponse" method="post" data-contact-form data-thanks="../thank-you/" novalidate>
            <div class="cform__field">
              <label class="visually-hidden" for="cfName">Your name (required)</label>
              <input id="cfName" name="entry.925536035" type="text" placeholder="Your Name*" autocomplete="name" required aria-describedby="cfNameErr">
              <span class="cform__error" id="cfNameErr"></span>
            </div>
            <div class="cform__field">
              <label class="visually-hidden" for="cfCompany">Company name</label>
              <input id="cfCompany" name="entry.117524234" type="text" placeholder="Company Name" autocomplete="organization">
            </div>
            <div class="cform__field">
              <label class="visually-hidden" for="cfEmail">Email address (required)</label>
              <input id="cfEmail" name="entry.408760395" type="email" placeholder="Email Address*" autocomplete="email" required aria-describedby="cfEmailErr">
              <span class="cform__error" id="cfEmailErr"></span>
            </div>
            <div class="cform__field">
              <label class="visually-hidden" for="cfPhone">Phone number (required)</label>
              <input id="cfPhone" name="entry.288379176" type="tel" placeholder="Phone Number*" autocomplete="tel" required pattern="[0-9()+.\- ]{7,}" aria-describedby="cfPhoneErr">
              <span class="cform__error" id="cfPhoneErr"></span>
            </div>
            <div class="cform__field cform__field--full">
              <label class="visually-hidden" for="cfMessage">Message</label>
              <textarea id="cfMessage" name="entry.1013603443" placeholder="Message" rows="6"></textarea>
            </div>
            <!-- spam trap: real visitors never see or fill this field -->
            <div class="visually-hidden" aria-hidden="true">
              <label for="cfWebsite">Leave this field empty</label>
              <input id="cfWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>
            <div class="cform__actions">
              <button class="cform__submit" type="submit">Send</button>
              <p class="cform__status" data-contact-status role="alert" hidden></p>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <div id="siteFooter"></div>
  <script src="../js/footer.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
