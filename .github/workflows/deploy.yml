# Builds the site and publishes it to Cloudflare on every push (or merged pull
# request) to the production branch: build/ goes into the R2 bucket, and the
# Worker in worker/index.js serves it.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts: Edit and Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
name: Deploy to Cloudflare (R2 + Worker)

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      BUCKET: codelynx-digital-site   # keep in sync with bucket_name in wrangler.toml
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: bash build.sh

      - name: Install wrangler
        run: npm install --global wrangler@4.144.0

      - name: Create R2 bucket if missing
        run: |
          if ! wrangler r2 bucket info "$BUCKET" > /dev/null 2>&1; then
            wrangler r2 bucket create "$BUCKET"
          fi

      - name: Upload site to R2
        working-directory: build
        run: |
          find . -type f | sed 's|^\./||' | sort > ../files.txt
          echo "Uploading $(wc -l < ../files.txt) files to $BUCKET"
          xargs -P 8 -I{} wrangler r2 object put "$BUCKET/{}" --file "{}" --remote < ../files.txt > /dev/null

      - name: Deploy Worker
        run: wrangler deploy
