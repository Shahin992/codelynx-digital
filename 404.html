  <link rel="apple-touch-icon" href="/images/icon-180.png">
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>

  <a class="skip-link" href="#main">Skip to content</a>

    <!-- ============ 404 ============ -->
    <section class="section teal nf-hero">

        <div class="nf-text">

        </div>
        <div class="nf-art" aria-hidden="true">
          <!-- 4-0-4 as a face: the 4s are the eyes, the 0 the nose. js/main.js draws it in and makes it blink. -->
          <svg class="nf-face" viewBox="0 0 320 340">
            <g class="nf-face__eyes">
              <path d="M68 16 20 136h96M94 66v126"/>
              <path d="M252 16l-48 120h96M278 66v126"/>

        </div>
      </div>
